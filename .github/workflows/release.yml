name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Both jobs create/edit the same release; run them sequentially
      # so they can't race each other on the tag.
      max-parallel: 1
      matrix:
        include:
          - runner: macos-latest # Apple Silicon
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          make build VERSION=${{ github.ref_name }}
          tar -czf minipulse-${{ github.ref_name }}-darwin-${{ matrix.arch }}.tar.gz minipulse README.md LICENSE
          shasum -a 256 minipulse-${{ github.ref_name }}-darwin-${{ matrix.arch }}.tar.gz > minipulse-${{ github.ref_name }}-darwin-${{ matrix.arch }}.tar.gz.sha256
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            minipulse-${{ github.ref_name }}-darwin-${{ matrix.arch }}.tar.gz
            minipulse-${{ github.ref_name }}-darwin-${{ matrix.arch }}.tar.gz.sha256
          generate_release_notes: true
