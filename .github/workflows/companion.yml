name: Companion

on:
  push:
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"
  pull_request:
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Assemble app bundle
        run: make app
